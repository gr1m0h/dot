'''

[tasks.setup-docker]
description = "Set up Docker with Colima (requires colima/lima via mise)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ -n "${CI:-}" ] || [ -n "${GITHUB_ACTIONS:-}" ]; then
    echo "Skipping Docker setup in CI environment"
    exit 0
fi
echo "Setting up Docker with Colima..."
if ! command -v colima &>/dev/null; then
    echo "Colima not found. Ensure mise tools are installed (mise install)."
    exit 1
fi
if ! command -v limactl &>/dev/null; then
    echo "Lima (limactl) not found. Colima requires Lima."
    exit 1
fi
if ! colima status &>/dev/null; then
    echo "Starting Colima..."
    colima start || {
        echo "Failed to start Colima. Check 'colima logs'."
        exit 1
    }
fi
echo "Setting docker context to colima..."
docker context use colima || echo "Set it manually with 'docker context use colima'"
echo "Docker setup completed!"
'''

[tasks.setup-mcp]
description = "Configure Claude MCP servers (GitHub Remote MCP)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ "${DOTFILES_CLAUDE:-0}" != "1" ]; then
    echo "Skipping Claude MCP setup (Claude is not selected)"
    exit 0
fi
if [ -n "${CI:-}" ] || [ -n "${GITHUB_ACTIONS:-}" ]; then
    echo "Skipping MCP setup in CI environment"
    exit 0
fi
echo "Setting up Claude MCP Servers..."
if ! command -v claude &>/dev/null; then
    echo "Warning: Claude CLI not found; run mise install, then mise run setup-mcp"
    exit 0
fi
if claude mcp list 2>/dev/null | grep -q "github"; then
    echo "GitHub Remote MCP server already configured"
else
    if command -v gh &>/dev/null; then
        github_token=$(gh auth token 2>/dev/null || echo "")
        if [ -z "$github_token" ]; then
            echo "Warning: GitHub CLI not authenticated, skipping GitHub MCP setup"
        else
            claude mcp add --transport http github https://api.githubcopilot.com/mcp \
                -H "Authorization: Bearer $github_token" \
                || echo "Warning: Failed to add GitHub Remote MCP server"
        fi
    else
        echo "Warning: GitHub CLI not found, skipping GitHub MCP setup"
    fi
fi
echo "MCP setup completed!"
'''

[tasks.setup-ghostty]
description = "Build Ghostty-Nvim.app from the tracked AppleScript"
sources = ["~/.local/share/ghostty-nvim/Ghostty-Nvim.applescript", "~/.local/share/ghostty-nvim/build-ghostty-nvim-app.sh"]
outputs = ["~/Applications/Ghostty-Nvim.app/Contents/Info.plist"]
run = "bash ~/.local/share/ghostty-nvim/build-ghostty-nvim-app.sh ~/.local/share/ghostty-nvim/Ghostty-Nvim.applescript"

# Named `bootstrap` so `mise bootstrap` runs it automatically in the final phase.
[tasks.bootstrap]
description = "Full machine setup (Homebrew, packages, macOS, Docker, MCP, Ghostty-Nvim)"
depends = ["setup-homebrew", "setup-packages", "setup-macos", "setup-docker", "setup-mcp", "setup-ghostty"]

# --- Bootstrap services: keep dotfile history saved automatically ---
[bootstrap.services.mise-history]
builtin = "history-watch"

[dotfiles]
"~/.Brewfile" = { mode = "track" }
# Agent targets are generated in local conf.d/agents.toml by dotfiles-lib.sh.
# Raw Codex config.toml, hooks.json and default.rules remain local.
"~/.config/bat/config" = { mode = "track" }
"~/.config/ghostty/config" = { mode = "track" }
"~/.config/git/config" = { mode = "template", source = "~/.dotfiles/git-config.tera" }
"~/.dotfiles/git-config.tera" = { mode = "track" }
"~/.config/git/ignore" = { mode = "track" }
"~/.config/mise/config.toml" = { mode = "track" }
"~/.config/nvim" = { mode = "track" }
"~/.config/sheldon/plugins.toml" = { mode = "track" }
"~/.config/starship/starship.toml" = { mode = "track" }
"~/.config/zsh/.zsh_aliases" = { mode = "track" }
"~/.config/zsh/.zsh_completions" = { mode = "track" }
"~/.config/zsh/.zshrc" = { mode = "track" }
"~/.config/zsh/scripts" = { mode = "track" }
"~/.editorconfig" = { mode = "track" }
"~/.hammerspoon/init.lua" = { mode = "track" }
# mmcp: the live file carries the real token (so GUI-launched clients work),
# therefore only the template source is tracked; the token is rendered per
# machine from ~/.env.
"~/.mmcp.json" = { mode = "template", source = "~/.dotfiles/mmcp.json.tera" }
"~/.dotfiles/mmcp.json.tera" = { mode = "track" }
"~/.local/share/ghostty-nvim/Ghostty-Nvim.applescript" = { mode = "track" }
"~/.local/share/ghostty-nvim/build-ghostty-nvim-app.sh" = { mode = "track" }
"~/.zshenv" = { mode = "track" }
