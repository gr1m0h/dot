# Convenience entry points for this dotfiles repo.
# Run from the repository root: `mise run <task>` (list with `mise tasks`).
#
# Dotfiles are managed by mise dotfiles (in place). To sync with the remote:
#   mise bootstrap dotfiles sync   # publish/fetch
#   mise bootstrap dotfiles pull   # apply incoming changes to live files

# Reflect the live ~/.claude config back into this repo's home/.claude/.
# Does not commit — review with `git diff` afterwards.
[tasks.sync-claude]
description = "reflect live ~/.claude config into home/.claude/"
run = "bash scripts/sync-claude.sh"

[tasks.sync-claude-dry]
description = "dry run of sync-claude (show changes, write nothing)"
run = "bash scripts/sync-claude.sh -n"

[tasks.sync-agent-configs]
description = "mirror selected portable agent files; preserve raw client settings"
run = "bash scripts/sync-agent-configs.sh --apply"

[tasks.sync-agent-configs-dry]
description = "preview agent configuration changes without writing"
run = "bash scripts/sync-agent-configs.sh --dry-run"

[tasks.apply-main]
description = "apply origin/main's tracked home/ files and selected agent config"
run = "bash scripts/apply-main.sh"

[tasks.init-machine-local]
description = "create machine-local configuration files without overwriting existing files"
run = "sh scripts/init-machine-local.sh"

[tasks.propose]
description = "mirror live tracked files into home/ for a PR (then review `git diff`)"
run = "bash scripts/propose.sh"

# Applies selected agent files: review/propose agent edits before running.
# Then run `mise install` to install the selected CLI(s).
[tasks.configure-agents]
description = "apply codex/claude/both config from checkout; preserve inactive and unrelated files"
usage = 'arg "agents" help="codex, claude, or both"'
run = 'bash scripts/apply-main.sh --local --agents-only --agents "$usage_agents"'

[tasks.test-dotfiles]
description = "test dotfile scripts in isolated temporary homes without network access"
run = "bash scripts/test-dotfiles.sh"
